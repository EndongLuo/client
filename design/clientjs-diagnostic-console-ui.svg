          <text x="18" y="306" class="sub">16:46</text><rect x="64" y="288" width="34" height="26" rx="13" fill="#E6F9ED"/><text x="77" y="306" class="t12s green">ok</text><text x="108" y="306" class="ink">codec map synced</text>
