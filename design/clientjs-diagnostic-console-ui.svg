          <text x="18" y="122" class="sub">16:43</text><rect x="64" y="104" width="42" height="26" rx="13" fill="#F0E8FF"/><text x="76" y="122" class="t12s purple">diag</text><text x="116" y="122" class="ink">read status sent</text>
          <text x="18" y="168" class="sub">16:43</text><rect x="64" y="150" width="34" height="26" rx="13" fill="#E6F9ED"/><text x="77" y="168" class="t12s green">ok</text><text x="108" y="168" class="ink">Robot ack 28ms</text>
          <text x="18" y="214" class="sub">16:44</text><rect x="64" y="196" width="48" height="26" rx="13" fill="#FFF1DB"/><text x="76" y="214" class="t12s orange">warn</text><text x="122" y="214" class="ink">heartbeat slow</text>
