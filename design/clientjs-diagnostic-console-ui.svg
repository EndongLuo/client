      <text x="24" y="232" class="t12 muted">1. 切换 Socket 地址</text>
      <text x="24" y="252" class="t12 muted">2. 查看节点心跳</text>
      <text x="24" y="272" class="t12 muted">3. 发送诊断指令</text>
