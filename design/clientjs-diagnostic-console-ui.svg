    .muted{fill:#626E80}
    .sub{fill:#8692A5}
    .white{fill:#FFFFFF}
    .blue{fill:#1450C6}
    .green{fill:#16A351}
    .orange{fill:#DA710F}
    .purple{fill:#663FB9}
    .cyan{fill:#039DBB}
    .red{fill:#D63031}
